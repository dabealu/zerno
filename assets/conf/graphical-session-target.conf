# Allow sway to start graphical-session.target at login and hold it for the
# session. The target ships RefuseManualStart=yes (blocks the standard sway
# integration) and StopWhenUnneeded=yes (drops it, taking PartOf services like
# voxtype down). Sway wiki "Systemd integration" pattern.
[Unit]
RefuseManualStart=no
StopWhenUnneeded=no