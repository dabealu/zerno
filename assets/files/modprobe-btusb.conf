# Bluetooth USB autosuspend
#
# Disables USB autosuspend for Bluetooth controllers to prevent dropped
# connections during active use (A2DP audio, HID input). When enabled,
# the kernel may suspend the BT controller during brief idle periods,
# causing audio stutter or headset disconnects.
#
# Arch Wiki recommended for Bluetooth stability issues.
# Trade-off: ~0.4W extra power draw (USB controller stays awake).
options btusb enable_autosuspend=0
