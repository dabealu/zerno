# WiFi power management for Intel wireless cards
#
# power_save=0: Disables WiFi radio sleep between beacons (802.11 Dynamic Power Save).
#   Eliminates latency spikes caused by radio wake cycles.
#   Trade-off: slightly higher power draw during light use.
#
# power_scheme=1: "Active" mode for iwlmvm driver (Intel-recommended for BT coexistence).
#   Prevents aggressive power saving that can interfere with Bluetooth audio on
#   combo WiFi/BT chips. Default (2=Balanced) may cause A2DP drops on some hardware.
options iwlwifi power_save=0
options iwlmvm power_scheme=1
