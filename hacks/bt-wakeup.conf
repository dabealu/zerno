# bt-wakeup.conf - wake a laptop from suspend with a Bluetooth keyboard.
#
# What this is: a systemd-tmpfiles drop-in. One line, run at every boot,
# sets one sysfs flag: "remote wakeup" enabled on the laptop's Bluetooth
# USB adapter. With it, any paired BT keyboard/mouse press wakes the
# sleeping machine.
#
# Steps:
#
# 0. Copy:
#      sudo cp bt-wakeup.conf /etc/tmpfiles.d/
#
# 1. Find the USB path of YOUR Bluetooth adapter:
#      ls -l /sys/class/bluetooth/
#    the hci0 link looks like:
#      hci0 -> ../../devices/pci0000:00/.../usb3/3-10/3-10:1.0/bluetooth/hci0
#    pick root one, e.g. hci0 without part after : in the name.
#    keep part ".../3-10", and append /power/wakeup:
#      /sys/devices/pci0000:00/.../usb3/3-10/power/wakeup
#
# 2. In the line below, replace BT_ADAPTER_PATH with result path
#
# 3. Apply:
#      sudo systemd-tmpfiles --create
#
# 4. Verify:
#      cat <BT_ADAPTER_PATH>/power/wakeup     # must say: enabled
#      sudo systemctl suspend                 # then press a key on the BT keyboard
#
# To revert, delete /etc/tmpfiles.d/bt-wakeup.conf and reboot.

w BT_ADAPTER_PATH/power/wakeup - - - - enabled
